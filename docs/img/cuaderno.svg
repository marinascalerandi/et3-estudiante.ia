  <g transform="rotate(8 70 262)">
    <rect x="10" y="250" width="130" height="20" rx="3" fill="#E2F3E6" stroke="#202124" stroke-width="3"/>
    <path d="M25 250 v8 M40 250 v5 M55 250 v8 M70 250 v5 M85 250 v8 M100 250 v5 M115 250 v8" stroke="#202124" stroke-width="2"/>
