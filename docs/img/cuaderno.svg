    <rect x="150" y="220" width="120" height="22" fill="#FBBC05"/>
    <rect x="270" y="220" width="18" height="22" fill="#EA4335"/>
    <path d="M150 220 L126 231 L150 242 Z" fill="#F6E3C6"/>
    <path d="M133 228 L126 231 L133 234 Z" fill="#202124"/>
